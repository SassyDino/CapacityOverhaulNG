[metadata]
language = "ENGLISH"
version = "0.1.0"

[translation]
"$ModName" = "Capacity Overhaul NG"
"$Default" = "Empty Translation"
"$Error.KeyNotFound" = "Provided translation key was not found. See log for more info."

"$MCP.Gen" = "General Settings"

"$MCP.Gen.ToggleFeatures" = "Toggle Features"
"$MCP.Gen.ToggleFeatures.Capacity" = "Capacity Features"
"$MCP.Gen.ToggleFeatures.Capacity.Debuffs" = "Enable Capacity-based Debuffs"
"$MCP.Gen.ToggleFeatures.Capacity.Debuffs.HelpMarker" = "If checked: Debuffs may be applied to the player while item count exceeds capacity. Further configuration is available."
"$MCP.Gen.ToggleFeatures.Capacity.Hands" = "Disable Hands/Weapons While Over Capacity"
"$MCP.Gen.ToggleFeatures.Capacity.Hands.HelpMarker" = "If checked: While the player's item count exceeds available item capacity, prevent the drawing or using of weapons, fists, and spells."
"$MCP.Gen.ToggleFeatures.Capacity.Pickup" = "Prevent Item Pickup While Over Capacity"
"$MCP.Gen.ToggleFeatures.Capacity.Pickup.HelpMarker" = "If checked: While the player's item count exceeds available item capacity, prevent the player from picking up items from the ground/worldspace."
"$MCP.Gen.ToggleFeatures.Capacity.Containers" = "Prevent Opening Containers While Over Capacity"
"$MCP.Gen.ToggleFeatures.Capacity.Containers.HelpMarker" = "If checked: While the player's item count exceeds available item capacity, prevent the player from accessing container inventories. This does not block access to the player's own inventory, or barter menus."
"$MCP.Gen.ToggleFeatures.Capacity.Interactions" = "Prevent Object Interactions While Over Capacity"
"$MCP.Gen.ToggleFeatures.Capacity.Interactions.HelpMarker" = "If checked: While the player's item count exceeds available item capacity, prevent the player from interacting with world triggers such as doors, buttons, and levers."
"$MCP.Gen.ToggleFeatures.Capacity.Skills" = "Skills Affect Capacity Limits"
"$MCP.Gen.ToggleFeatures.Capacity.Skills.HelpMarker" = "If checked: Levelling up certain skills will provide a bonus to the capacity of some categories. Alchemy -> Alchemy // Archery -> Ammunition // Speech, Lockpicking, Pickpocket (Averaged) -> Coins"
"$MCP.Gen.ToggleFeatures.Capacity.QuestItems" = "Quest Item Take Up Capacity"
"$MCP.Gen.ToggleFeatures.Capacity.QuestItems.HelpMarker" = "If checked: Quest items will use up capacity, with the category being determined via the usual rules. Could be problematic in the case of certain heavy quest items, e.g. the Dragonstone, and the Elder Scrolls."
"$MCP.Gen.ToggleFeatures.Weight" = "Weight Features"
"$MCP.Gen.ToggleFeatures.Weight.Debuffs" = "Enable Weight-based Debuffs"
"$MCP.Gen.ToggleFeatures.Weight.Debuffs.HelpMarker" = "If checked: Debuffs may be applied to the player dependant on the total weight of carried items relative to carry weight limit. Further configuration is available,"
"$MCP.Gen.ToggleFeatures.Weight.Vanilla" = "Use Vanilla Carry Weight"
"$MCP.Gen.ToggleFeatures.Weight.Vanilla.HelpMarker" = "If checked: Disables all changes to carry weight made by this mod. The player's carry weight will be left at the vanilla value, and no modifiers or adjustments will be added. Debuffs based on carry weight may still be configured and applied."
"$MCP.Gen.ToggleFeatures.Weight.Stamina" = "Max Stamina Affects Carry Weight"
"$MCP.Gen.ToggleFeatures.Weight.Stamina.HelpMarker" = "If checked: The player's carry weight will be adjusted dynamically based on their max (i.e. full bar value) stamina. Any bonuses will be calculated based only on additional stamina, above the base value (100pts). Further configuration is available in this mod's config menu."
"$MCP.Gen.ToggleFeatures.Weight.Level" = "Current Level Affects Carry Weight"
"$MCP.Gen.ToggleFeatures.Weight.Level.HelpMarker" = "If checked: The player's carry weight will be adjusted dynamically based on their current level. Further configuration is available in this mod's config menu."
"$MCP.Gen.ToggleFeatures.Weight.Race" = "Player's Race Affects Carry Weight"
"$MCP.Gen.ToggleFeatures.Weight.Race.HelpMarker" = "If checked: The player's carry weight will be adjusted by a flat modifier, determined by their race. Configuration of these modifier values is available in this mod's config menu."

"$MCP.Gen.CapacitySystem" = "Capacity System Configuration"
"$MCP.Gen.CapacitySystem.Capacities" = "Category Capacities"
"$MCP.Gen.CapacitySystem.Capacities.Baseline" = "Baseline Settings"
"$MCP.Gen.CapacitySystem.Capacities.Baseline.Huge" = "Huge Item Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Baseline.Huge.HelpMarker" = "Maximum amount of 'Huge' items that can be carried without exceeding capacity."
"$MCP.Gen.CapacitySystem.Capacities.Baseline.HugeShared" = "Huge Items Share Storage Space With Other Items"
"$MCP.Gen.CapacitySystem.Capacities.Baseline.HugeShared.HelpMarker" = "If checked: The amount of 'Large', 'Medium', 'Small', and 'Tiny' items that can be carried will be determined based on the 'Huge' item capacity. Otherwise, the limit for smaller categories will be based on the 'Large' item capacity, and 'Huge' items will be tracked independently."
"$MCP.Gen.CapacitySystem.Capacities.Baseline.Large" = "Large Item Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Baseline.Large.HelpMarker" = "Maximum amount of 'Large' items that can be carried without exceeding capacity."
"$MCP.Gen.CapacitySystem.Capacities.Derived" = "Primary Categories"
"$MCP.Gen.CapacitySystem.Capacities.Derived.LargePerHuge" = "Large Items Per Huge Space"
"$MCP.Gen.CapacitySystem.Capacities.Derived.LargePerHuge.HelpMarker" = "The amount of 'Large' items required to fill the space of one 'Huge' item."
"$MCP.Gen.CapacitySystem.Capacities.Derived.MediumPerLarge" = "Medium Items Per Large Space"
"$MCP.Gen.CapacitySystem.Capacities.Derived.MediumPerLarge.HelpMarker" = "The amount of 'Medium' items required to fill the space of one 'Large' item."
"$MCP.Gen.CapacitySystem.Capacities.Derived.SmallPerMedium" = "Small Items Per Medium Space"
"$MCP.Gen.CapacitySystem.Capacities.Derived.SmallPerMedium.HelpMarker" = "The amount of 'Small' items required to fill the space of one 'Medium' item."
"$MCP.Gen.CapacitySystem.Capacities.Derived.TinyPerSmall" = "Tiny Items Per Small Space"
"$MCP.Gen.CapacitySystem.Capacities.Derived.TinyPerSmall.HelpMarker" = "The amount of 'Tiny' items required to fill the space of one 'Small' item."
"$MCP.Gen.CapacitySystem.Capacities.Misc" = "Miscellaneous Categories"
"$MCP.Gen.CapacitySystem.Capacities.Misc.Alchemy" = "Alchemical Item Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Misc.Alchemy.HelpMarker" = "Maximum amount of 'Alchemy' items (potions & poisons) that can be carried without filling primary storage. Any overflowing 'Alchemy' items will be treated as 'Tiny' items, and will use up primary storage space."
"$MCP.Gen.CapacitySystem.Capacities.Misc.Ammo" = "Ammo Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Misc.Ammo.HelpMarker" = "Maximum amount of 'Ammunition' items that can be carried without filling primary storage. Any overflowing 'Ammunition' items will be treated as 'Tiny' items, and will use up primary storage space."
"$MCP.Gen.CapacitySystem.Capacities.Misc.Coin" = "Coin Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Misc.Coin.HelpMarker" = "Maximum amount of Coins that can be carried without filling primary storage. Any overflowing Coins will use up primary storage space - the amount of space used is determined by the setting below."
"$MCP.Gen.CapacitySystem.Capacities.Misc.CoinsPerTiny" = "Coins Per Tiny Space"
"$MCP.Gen.CapacitySystem.Capacities.Misc.CoinsPerTiny.HelpMarker" = "When overflowing into primary storage: The amount of Coins required to fill the space of one 'Tiny' item."
"$MCP.Gen.CapacitySystem.Capacities.Misc.Gems" = "Gems Use The Same Storage Category As Coins"
"$MCP.Gen.CapacitySystem.Capacities.Misc.Gems.HelpMarker" = "If checked: Gemstones will be stored in the 'Coin' category, while it has space. Overflowing gems will fill primary storage as usual."
"$MCP.Gen.CapacitySystem.Capacities.Misc.CoinsPerGem" = "Amount Of Coin Storage Used By Each Gem"
"$MCP.Gen.CapacitySystem.Capacities.Misc.CoinsPerGem.HelpMarker" = "The amount of 'Coin' category storage that is used up by one gemstone."
"$MCP.Gen.CapacitySystem.Capacities.Weapons" = "Weapon Capacities"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Enable" = "Weapons & Shields Have Independent Capacity Thresholds"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Enable.HelpMarker" = "If checked: Weapons will have their own capacity categories, and as such will not use up shared capacity by default. If a weapon category exceeds its capacity, overflow will spill into any available shared storage before causing over-capacity."
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Large" = "Large Weapon Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Large.HelpMarker" = "The amount of Large Weapons (Greatswords, Battleaxes, Warhammers, Staves) that can be carried before overflowing as 'Huge' items."
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Medium" = "Medium Weapon Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Medium.HelpMarker" = "The amount of Medium Weapons (Swords, War Axes, Maces) that can be carried before overflowing as 'Large' items."
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Small" = "Small Weapon Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Small.HelpMarker" = "The amount of Small Weapons (Daggers) that can be carried before overflowing as 'Medium' items."
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Ranged" = "Ranged Weapon Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Ranged.HelpMarker" = "The amount of Ranged Weapons (Bows, Crossbows) that can be carried before overflowing as 'Huge' items."
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Shield" = "Shield Capacity"
"$MCP.Gen.CapacitySystem.Capacities.Weapons.Shield.HelpMarker" = "The amount of Shields that can be carried before overflowing as 'Huge' items."
"$MCP.Gen.CapacitySystem.Capacities.Visualiser" = "Capacity Visualiser"
"$MCP.Gen.CapacitySystem.Capacities.Visualiser.NewWindow" = "Open Visualiser in Separate Window"
"$MCP.Gen.CapacitySystem.Capacities.Visualiser.Opened" = "Visualiser Opened in Separate Window"
"$MCP.Gen.CapacitySystem.Capacities.Visualiser.LoadCharacter" = "To view the capacity visualiser, player character must be present and mod settings must be loaded."
"$MCP.Gen.CapacitySystem.Definitions" = "Item Category Definitions"
"$MCP.Gen.CapacitySystem.Definitions.Huge" = "Huge Item Weight"
"$MCP.Gen.CapacitySystem.Definitions.Huge.HelpMarker" = "The minimum weight required for an item to be classified as 'Huge'."
"$MCP.Gen.CapacitySystem.Definitions.Large" = "Large Item Weight"
"$MCP.Gen.CapacitySystem.Definitions.Large.HelpMarker" = "The minimum weight required for an item to be classified as 'Large'."
"$MCP.Gen.CapacitySystem.Definitions.Medium" = "Medium Item Weight"
"$MCP.Gen.CapacitySystem.Definitions.Medium.HelpMarker" = "The minimum weight required for an item to be classified as 'Medium'."
"$MCP.Gen.CapacitySystem.Definitions.Small" = "Small Item Weight"
"$MCP.Gen.CapacitySystem.Definitions.Small.HelpMarker" = "The minimum weight required for an item to be classified as 'Small'. All items weighing less than this will be considered 'Tiny' or Weightless."

"$MCP.Gen.Weight" = "Carry Weight Settings"
"$MCP.Gen.Weight.General" = "General Weight Settings"
"$MCP.Gen.Weight.General.Base" = "Base Carry Weight"
"$MCP.Gen.Weight.General.Base.HelpMarker" = "The player's base carry weight value, before any modifiers or bonuses are applied."
"$MCP.Gen.Weight.General.Stamina" = "Stamina-based Carry Weight Modification"
"$MCP.Gen.Weight.General.Stamina.HelpMarker" = "Options for adding a bonus to carry weight dependant on the player's current maximum stamina."
"$MCP.Gen.Weight.General.Stamina.Modifier" = "Stamina Weight Bonus Modifier"
"$MCP.Gen.Weight.General.Stamina.Modifier.HelpMarker" = "A multiplier to be applied to the carry weight bonus: 1 = Unchanged | 0.5 = Halved Bonus | 2 = Doubled bonus."
"$MCP.Gen.Weight.General.Stamina.Simple" = "Use Simple Calculation For Stamina Weight Bonus"
"$MCP.Gen.Weight.General.Stamina.Simple.HelpMarker" = "If checked: The bonus will be linear, i.e. +X carry weight per stamina point, where 'X' is a constant value determined by the setting below. Otherwise, a more complex method will be used (configurable in Advanced Settings)."
"$MCP.Gen.Weight.General.Stamina.Bonus" = "Bonus Carry Weight Per Stamina Point"
"$MCP.Gen.Weight.General.Stamina.Bonus.HelpMarker" = "The amount of carry weight added for each point of stamina. Decimals are allowed - for example, a value of 0.25 would result in 1 extra carry weight for every 4 points of stamina."
"$MCP.Gen.Weight.General.Stamina.Temp" = "Temporary Stamina Sources Provide Bonus"
"$MCP.Gen.Weight.General.Stamina.Temp.HelpMarker" = "If checked: Temporary sources of stamina (Potions, Enchantments, etc.) will be included when calculating the carry weight bonus."
"$MCP.Gen.Weight.General.Level" = "Level-based Carry Weight Modification"
"$MCP.Gen.Weight.General.Level.HelpMarker" = "Options for adding a bonus to carry weight dependant on the player's current level."
"$MCP.Gen.Weight.General.Level.Modifier" = "Level Weight Bonus Modifier"
"$MCP.Gen.Weight.General.Level.Modifier.HelpMarker" = "A multiplier to be applied to the carry weight bonus: 1 = Unchanged | 0.5 = Halved Bonus | 2 = Doubled bonus."
"$MCP.Gen.Weight.General.Level.Simple" = "Use Simple Calculation For Level Weight Bonus"
"$MCP.Gen.Weight.General.Level.Simple.HelpMarker" = "If checked: The bonus will be linear, i.e. +X carry weight per level, where 'X' is a constant value determined by the setting below. Otherwise, a more complex method will be used (configurable in Advanced Settings)."
"$MCP.Gen.Weight.General.Level.Bonus" = "Bonus Carry Weight Per Level"
"$MCP.Gen.Weight.General.Level.Bonus.HelpMarker" = "The amount of carry weight added for each level. Decimals are allowed - for example, a value of 0.25 would result in 1 extra carry weight for every 4 levels."
