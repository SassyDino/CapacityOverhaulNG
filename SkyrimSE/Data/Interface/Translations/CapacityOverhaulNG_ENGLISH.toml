"$MCP.Adv.Debug" = "Debug Settings"
"$MCP.Adv.Debug.Level" = "Log Level"
"$MCP.Adv.Debug.Level.HelpMarker" = "Select a log level - recommended during regular play to leave on 'Info' or 'Debug'. If experiencing any issues (especially any crashes related to this mod) please set to 'Trace', and if the issue then persists or is reproducable include the log file in your report."
"$MCP.Adv.Debug.CurrentLevel" = "Current Log Level"
"$MCP.Adv.Debug.ModEnabled" = "Mod Enabled"
"$MCP.Adv.Debug.ModEnabled.HelpMarker" = "If checked: Enable this mod. Other settings are respected, so individually disable features will remain disabled. Uncheck to completely disable all features of this mod."

