"$MCP.Gen.Debuffs" = "Debuff Settings"
"$MCP.Gen.Debuffs.Activation" = "Activation"
"$MCP.Gen.Debuffs.Activation.HelpMarker" = "Configure the start point (floor) of weight-based debuffs. Once above the floor, debuffs will increase in severity as the player's inventory weight gets closer to their maximum carry weight."
"$MCP.Gen.Debuffs.Activation.FloorIsPct" = "Debuff Encumbrance Floor is a Percentage"
"$MCP.Gen.Debuffs.Activation.FloorIsPct.HelpMarker" = "If checked: The weight-based debuff floor will be a percentage of the player's maximum carry weight. Otherwise, the floor will be a constant value."
"$MCP.Gen.Debuffs.Activation.FloorConst" = "Debuff Encumbrance Floor (Constant)"
"$MCP.Gen.Debuffs.Activation.FloorConst.HelpMarker" = "The encumbrance at which debuffs will begin to take effect. For example: if set to 50, then debuffs will begin to be applied once the player's held items exceeds 50 weight."
"$MCP.Gen.Debuffs.Activation.FloorPercent" = "Debuff Encumbrance Floor (Percent)"
"$MCP.Gen.Debuffs.Activation.FloorPercent.HelpMarker" = "The percentage of encumbrance at which debuffs will begin to take effect. For example: if set to 0.5, then debuffs will begin to be applied once the weight of the player's held items exceeds half of their carry weight limit."
"$MCP.Gen.Debuffs.Speed" = "Movement Speed"
"$MCP.Gen.Debuffs.Speed.HelpMarker" = "Reduce the player's movement speed while debuffed. Subtracts a percentage from the default speed. For example: at maximum severity, a setting of 0.75 would result in movement speed being 25% of default."
"$MCP.Gen.Debuffs.Speed.Enable" = "Enable"
"$MCP.Gen.Debuffs.Speed.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.Speed.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.Speed.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."
"$MCP.Gen.Debuffs.Stealth" = "Stealth"
"$MCP.Gen.Debuffs.Stealth.HelpMarker" = "Increase the player's movement noise while debuffed. Adds a percentage to the default value. For example: at maximum severity, a setting of 1.0 would result in twice the amount of movement noise."
"$MCP.Gen.Debuffs.Stealth.Enable" = "Enable"
"$MCP.Gen.Debuffs.Stealth.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.Stealth.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.Stealth.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."
"$MCP.Gen.Debuffs.StamDrain" = "Stamina Drain"
"$MCP.Gen.Debuffs.StamDrain.HelpMarker" = "While debuffed, increase stamina drain from sprinting. Adds a percentage to the default value. For example: at maximum severity, a setting of 1.0 would result in sprinting draining twice the amount of stamina per second."
"$MCP.Gen.Debuffs.StamDrain.Enable" = "Enable"
"$MCP.Gen.Debuffs.StamDrain.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.StamDrain.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.StamDrain.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."
"$MCP.Gen.Debuffs.StamRegen" = "Stamina Regeneration"
"$MCP.Gen.Debuffs.StamRegen.HelpMarker" = "Reduce the player's stamina regeneration rate while debuffed. Subtracts a percentage from the default rate. For example: at maximum severity, a setting of 0.75 would result in stamina regeneration being 25% of the default regen speed."
"$MCP.Gen.Debuffs.StamRegen.Enable" = "Enable"
"$MCP.Gen.Debuffs.StamRegen.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.StamRegen.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.StamRegen.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."
"$MCP.Gen.Debuffs.WeapSpeed" = "Weapon Speed"
"$MCP.Gen.Debuffs.WeapSpeed.HelpMarker" = "Feature not implemented!"
"$MCP.Gen.Debuffs.WeapSpeed.Enable" = "Enable"
"$MCP.Gen.Debuffs.WeapSpeed.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.WeapSpeed.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.WeapSpeed.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."
"$MCP.Gen.Debuffs.AttackDmg" = "Physical Attack Damage"
"$MCP.Gen.Debuffs.AttackDmg.HelpMarker" = "Reduce the player's damage dealt with physical attacks (melee, fists, bows). Subtracts a percentage from the default value. For example: at maximum severity, a setting of 0.75 would result in damage dealt being 25% of default."
"$MCP.Gen.Debuffs.AttackDmg.Enable" = "Enable"
"$MCP.Gen.Debuffs.AttackDmg.Enable.HelpMarker" = "If checked: This debuff will be applied once the player's inventory weight is above the debuff floor."
"$MCP.Gen.Debuffs.AttackDmg.Max" = "Maximum Severity"
"$MCP.Gen.Debuffs.AttackDmg.Max.HelpMarker" = "The maximum possible debuff applied to this attribute. Severity will grow linearly as inventory weight increases from the debuff floor to maximum carry weight."

"$MCP.Gen.UI" = "Interface Settings"
"$MCP.Gen.UI.Appearance" = "Config Menu Appearance"
"$MCP.Gen.UI.Appearance.CustomStyling" = "Enable Custom Menu Styling"
"$MCP.Gen.UI.Appearance.CustomStyling.HelpMarker" = "If checked: Enables custom MCP styling for this mod, to try and achieve a more 'Skyrim'-feeling menu design. If you encounter any issues, or if the styling simply isn't to your liking, you can disable it here!"
