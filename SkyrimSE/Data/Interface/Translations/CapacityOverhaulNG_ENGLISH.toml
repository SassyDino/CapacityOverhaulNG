"$MCP.Adv.Weight.Level.Config" = "Configure Parameters"
"$MCP.Adv.Weight.Level.Config.Rate" = "Level Bonus Growth Rate"
"$MCP.Adv.Weight.Level.Config.Rate.HelpMarker" = "Negative values result in diminishing returns - larger bonuses to carry weight per-level at lower levels, with the bonus-per-level reducing the more the player levels up. Positive values reverse this effect."
"$MCP.Adv.Weight.Level.Config.Pivot" = "Level Bonus Pivot"
"$MCP.Adv.Weight.Level.Config.Pivot.HelpMarker" = "Adjust how soon the bonus rate will begin to drop off/pick up. This value is approximately equal to the player level at which the bonus will be +50%."
