"$MCP.Gen.UI.Language.Manual.HelpMarker" = "If checked: Override automatic selection of this mod's language file, if you wish to manually choose a different language."

"$MCP.Adv" = "Advanced Settings"

"$MCP.Adv.Weight" = "Complex Carry Weight System"
"$MCP.Adv.Weight.Stamina" = "Parameters for Stamina-Based Bonus to Carry Weight"
"$MCP.Adv.Weight.Stamina.Config" = "Configure Parameters"
"$MCP.Adv.Weight.Stamina.Config.Rate" = "Stamina Bonus Growth Rate"
"$MCP.Adv.Weight.Stamina.Config.Rate.HelpMarker" = "Negative values result in diminishing returns - larger bonuses to carry weight per stamina point at lower stamina values, with the bonus-per-stamina reducing as stamina gets higher. Positive values reverse this effect."
"$MCP.Adv.Weight.Stamina.Config.Pivot" = "Stamina Bonus Pivot"
"$MCP.Adv.Weight.Stamina.Config.Pivot.HelpMarker" = "Adjust how soon the bonus rate will begin to drop off/pick up. This value is approximately equal to the stamina value at which the bonus will be +25%."
